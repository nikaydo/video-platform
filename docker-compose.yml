# Локальный запуск всей системы: шлюз и три сервиса.
#
#   docker compose up --build
#
# Значения по умолчанию предназначены только для разработки.

services:
  postgres-auth:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - pgauth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-tokens:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokens
      POSTGRES_PASSWORD: tokens
      POSTGRES_DB: tokens
    volumes:
      - pgtokens:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokens -d tokens"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8-alpine
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
      args:
        CONTRACT_PATH: ../grpc-contract
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://auth:auth@postgres-auth:5432/auth?sslmode=disable
      # Подставьте настоящее значение: openssl rand -base64 48
      JWT_SECRET: "${JWT_SECRET:-local-development-secret-not-for-production-use}"
      HOST: 0.0.0.0
      PORT: 50051

  api-tokens-service:
    build:
      context: ./api-tokens-service
      args:
        CONTRACT_PATH: ../grpc-contract
    depends_on:
      postgres-tokens:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tokens:tokens@postgres-tokens:5432/tokens?sslmode=disable
      HOST: 0.0.0.0
      PORT: 50052

  video-service:
    build:
      context: ./video-service
      args:
        CONTRACT_PATH: ../grpc-contract
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_NAME: video
      VIDEO_DIR: /app/storage/video
      HOST: 0.0.0.0
      PORT: 50053
    volumes:
      - videos:/app/storage

  video-platform:
    build:
      context: .
      args:
        CONTRACT_PATH: ../grpc-contract
    depends_on:
      - auth-service
      - api-tokens-service
      - video-service
    ports:
      - "8080:8080"
    environment:
      AUTH_HOST: auth-service
      AUTH_PORT: 50051
      TOKEN_HOST: api-tokens-service
      TOKEN_PORT: 50052
      VIDEO_HOST: video-service
      VIDEO_PORT: 50053
      HOST: 0.0.0.0
      PORT: 8080
      # Локально по http Secure-cookie не работает, поэтому выключаем.
      # Заголовки безопасности включаются вместе с этим флагом.
      COOKIE_SECURE: "false"

volumes:
  pgauth:
  pgtokens:
  mongodata:
  videos: