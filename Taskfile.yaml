version: '3'

vars:
  BINARY: bin/video-platform
  # Контракт живёт в отдельном репозитории и подтягивается как модуль.
  # SERVICES перечисляет клоны, из которых собираются сервисы системы.
  SERVICES: auth-service api-tokens-service video-service

tasks:
  default:
    desc: Список доступных задач
    cmds:
      - task --list

  deps:
    desc: Скачать зависимости
    cmds:
      - go mod download

  build:
    desc: Собрать сервис
    deps: [deps]
    cmds:
      - go build -trimpath -o {{.BINARY}} ./cmd
    generates:
      - '{{.BINARY}}'

  run:
    desc: Запустить сервис
    deps: [build]
    cmds:
      - '{{.BINARY}}'

  test:
    desc: Модульные тесты
    cmds:
      - go test -race ./...

  test:integration:
    desc: Интеграционные тесты (нужен TEST_DATABASE_URL)
    env:
      TEST_DATABASE_URL: '{{.TEST_DATABASE_URL | default ""}}'
    cmds:
      - go test -race -v ./internal/database/

  cover:
    desc: Тесты с отчётом о покрытии
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    desc: Форматирование и статический анализ
    cmds:
      - test -z "$(gofmt -l . | grep -v '^$$' || true)"
      - go vet ./...
      - |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

  fmt:
    desc: Отформатировать код
    cmds:
      - gofmt -w .

  clone-services:
    desc: Клонировать соседние сервисы, нужные для сборки
    cmds:
      - |
        for s in {{.SERVICES}}; do
          if [ ! -d "../$s" ]; then
            git clone --depth 1 "https://github.com/nikaydo/$s.git" "../$s"
          fi
        done

  up:
    desc: Поднять всю систему в Docker
    deps: [clone-services]
    cmds:
      - docker compose up --build

  down:
    desc: Остановить контейнеры
    cmds:
      - docker compose down -v
