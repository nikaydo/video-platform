name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Тесты и статический анализ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      # Контракт подтягивается из прокси модулей по версии из go.mod.
      # Локальная замена на ../grpc-contract нужна только при разработке
      # контракта: опубликованная версия не содержит ещё не выпущенных
      # изменений.
      - name: Скачать зависимости
        run: go mod download

      - name: Проверить форматирование
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "Файлы требуют gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Сборка
        run: go build -trimpath -o /tmp/video-platform ./cmd

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ
        run: docker build -t video-platform:ci .

      - name: Проверить, что .env не попал в образ
        run: |
          if docker run --rm --entrypoint sh video-platform:ci -c 'test -f /app/.env'; then
            echo ".env попал в образ"
            exit 1
          fi
          echo ".env в образе отсутствует"
